# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD NHA (Ninja Hacker Academy): two domains, five Windows Server 2019 machines.
# Isoloom builds the machines; GOAD's own playbooks build the lab from a controller.
version: 1
name: nha

networks:
  lab: { cidr: 192.168.56.0/24 }

# Every box is GOAD's Windows Server 2019 image, 2 CPUs, WinRM set up by the box itself; said
# once here. Sizes differ per machine.
common:
  resources: { cpus: 2, memory_mb: 3000 }
  vm:
    os: windows-server-2019
    image: { vagrant: mayfly/windows_server2019 }
    provision: [vagrant/ConfigureRemotingForAnsible.ps1]

groups:
  domain-controllers:
    members: [dc01, dc02]

machines:
  dc01:
    networks: { lab: 10 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    vm: {}

  dc02:
    networks: { lab: 20 }
    services: [{ port: 53, name: dns }, { port: 88, name: kerberos }, { port: 389, name: ldap }, { port: 445, name: smb }]
    vm: {}

  srv01:
    networks: { lab: 21 }
    services: [{ port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 5000 }
    vm: {}

  srv02:
    networks: { lab: 22 }
    services: [{ port: 445, name: smb }]
    resources: { cpus: 2, memory_mb: 5000 }
    vm: {}

  srv03:
    networks: { lab: 23 }
    services: [{ port: 445, name: smb }]
    vm: {}

provision:
  - ansible: ansible/nha.yml
    requirements: ansible/requirements_311.yml
    # The lab's own per-host variables (which domain each machine belongs to) and the keyboard layouts.
    inventory: [ad/NHA/data/inventory]
    # What each machine plays in the lab: the groups GOAD's playbooks target.
    groups:
      domain: [dc01, dc02, srv01, srv02, srv03]
      dc: [dc01, dc02]
      server: [srv01, srv02, srv03]
      parent_dc: [dc01, dc02]
      trust: [dc01, dc02]
      adcs: [dc01]
      iis: [srv01]
      mssql: [srv02]
      mssql_ssms: [srv02]
      update: [dc01, dc02, srv01, srv02, srv03]
      defender_on: [dc01, dc02, srv01, srv02, srv03]
    # The lab's settings, as GOAD's playbooks read them.
    vars:
      domain_name: NHA
      admin_user: administrator
      force_dns_server: 'no'
      dns_server: 1.1.1.1
      dns_server_forwarder: 1.1.1.1
      add_route: 'no'
      route_gateway: 192.168.56.1
      route_network: 10.0.0.0/8
      enable_http_proxy: 'no'
      proxy_ip: 'x.x.x.x'
      proxy_port: '8080'
      ad_http_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      ad_https_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'

message: |
  NHA is up: domain controllers at {{ machines.dc01.addresses.lab }} and {{ machines.dc02.addresses.lab }},
  servers at {{ machines.srv01.addresses.lab }}, {{ machines.srv02.addresses.lab }} and {{ machines.srv03.addresses.lab }}.
